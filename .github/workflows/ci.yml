name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: evidencedesk
          POSTGRES_PASSWORD: evidencedesk
          POSTGRES_DB: evidencedesk
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U evidencedesk -d evidencedesk"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      ED_DATABASE_URL: postgresql+psycopg://evidencedesk:evidencedesk@localhost:5432/evidencedesk
      TEST_DATABASE_URL: postgresql+psycopg://evidencedesk:evidencedesk@localhost:5432/evidencedesk
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --all-groups
      - run: uv run ruff check .
      - run: uv run mypy src
      - run: uv run alembic upgrade head
      - run: uv run pytest
